[project]
name = "kg-recall-poc"
version = "0.1.0"
description = "NHTSA 리콜 데이터로 만든 온톨로지 기반 지식그래프 RAG PoC"
requires-python = ">=3.11"
dependencies = [
  "rdflib>=7.0",
  "pyshacl>=0.26",
  "pydantic>=2.7",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40", "openai>=1.50"]
mcp = ["mcp>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kgpoc"]
